name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sprint-test-only
          POSTGRES_DB: meadow_sprint_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:sprint-test-only@127.0.0.1:55439/meadow_sprint_test"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc --noEmit` alone fails on a fresh checkout: Next.js 16's typed
      # routes (e.g. `LayoutProps<"/">` in layout.tsx) are ambient types
      # generated into .next/types by the Next CLI, not hand-written —
      # locally this "just works" because a prior `next dev`/`build` already
      # generated them, but CI starts with no .next directory at all.
      - name: Generate Next.js route types
        run: pnpm --filter web exec next typegen

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck worker
        run: pnpm --filter worker typecheck

      - name: Lint web
        run: pnpm --filter web lint

      - name: Apply migrations to disposable test database
        run: pnpm --filter @finance-app/db migrate:deploy

      - name: Test
        env:
          MEADOW_TEST_DATABASE_URL: "postgresql://postgres:sprint-test-only@127.0.0.1:55439/meadow_sprint_test"
        run: pnpm test

      - name: Build web
        run: pnpm build
