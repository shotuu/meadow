name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts's env("DATABASE_URL") throws eagerly at config-load
      # time (during `prisma generate`, which runs on every `pnpm install`
      # via packages/db's postinstall hook) if the variable is unset at
      # all — even though generate never actually connects to a database.
      # This placeholder just needs to exist and parse as a connection
      # string; nothing in this workflow talks to a real Postgres instance.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc --noEmit` alone fails on a fresh checkout: Next.js 16's typed
      # routes (e.g. `LayoutProps<"/">` in layout.tsx) are ambient types
      # generated into .next/types by the Next CLI, not hand-written —
      # locally this "just works" because a prior `next dev`/`build` already
      # generated them, but CI starts with no .next directory at all.
      - name: Generate Next.js route types
        run: pnpm --filter web exec next typegen

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck worker
        run: pnpm --filter worker typecheck

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build
